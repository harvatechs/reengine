<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161a" />
      <stop offset="100%" stop-color="#0b0b0e" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#7f5af0" />
      <stop offset="100%" stop-color="#6246ea" />
    </linearGradient>
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2cb67d" />
      <stop offset="100%" stop-color="#00ffff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#242629" stroke-width="6" />

  <!-- Outer Cyber Hexagon -->
  <polygon points="256,64 422,160 422,352 256,448 90,352 90,160" 
           fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linejoin="round" opacity="0.8" />

  <!-- Inner Reverse Engineering Circuit Geometry -->
  <polygon points="256,110 382,183 382,329 256,402 130,329 130,183" 
           fill="#16161a" stroke="#2cb67d" stroke-width="4" stroke-dasharray="16,8" opacity="0.6" />

  <!-- Center Stylized 'R' & Reverse Arrow Motif -->
  <g filter="url(#glow)">
    <!-- Vertical stem -->
    <path d="M190 160 L190 352" stroke="url(#accentGrad)" stroke-width="26" stroke-linecap="round" />
    
    <!-- R upper loop -->
    <path d="M190 160 H280 C330 160, 330 250, 280 250 H190" 
          fill="none" stroke="url(#accentGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- R lower diagonal leg with cyber circuit arrow -->
    <path d="M260 250 L330 352" stroke="url(#cyberCyan)" stroke-width="26" stroke-linecap="round" />

    <!-- Disassembly node accent points -->
    <circle cx="256" cy="64" r="10" fill="#00ffff" />
    <circle cx="422" cy="160" r="10" fill="#7f5af0" />
    <circle cx="422" cy="352" r="10" fill="#7f5af0" />
    <circle cx="256" cy="448" r="10" fill="#00ffff" />
    <circle cx="90" cy="352" r="10" fill="#7f5af0" />
    <circle cx="90" cy="160" r="10" fill="#7f5af0" />
  </g>

  <!-- Circuit nodes -->
  <circle cx="330" cy="352" r="8" fill="#00ffff" />
</svg>
