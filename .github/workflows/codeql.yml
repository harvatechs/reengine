name: codeql
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
permissions:
  security-events: write
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@b5ebac6f759a0e49b940254b8910e58610443140 # v3.28.18
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@b5ebac6f759a0e49b940254b8910e58610443140 # v3.28.18
