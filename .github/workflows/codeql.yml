name: codeql
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
permissions:
  security-events: write
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@b5ebac6f759a0e49b940254b8910e58610443140 # v3.28.18
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@b5ebac6f759a0e49b940254b8910e58610443140 # v3.28.18
