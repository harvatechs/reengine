name: Feature Request
description: Propose a new feature or enhancement for ReEngine CLI
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: textarea
    id: summary
    attributes:
      label: Problem & Proposal
      description: What problem does this solve, and how would you like ReEngine CLI to behave?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative designs you considered.
